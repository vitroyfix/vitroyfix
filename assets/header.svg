<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Peter Wangimwa — vitroyfix</title>
  <desc id="desc">Full-stack engineer and cybersecurity analyst based in Nairobi, Kenya.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#1f6feb" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#30363d" stroke-width="0.6" stroke-opacity="0.45"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="340" rx="18"/></clipPath>
    <clipPath id="type"><rect x="0" y="0" width="0" height="40" class="typer"/></clipPath>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .typer { animation: type 3.2s steps(43) 0.6s forwards; }
    .cursor { animation: blink 1s step-end infinite; }
    .fade { opacity: 0; animation: fade 0.9s ease-out forwards; }
    .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.35s; } .d3 { animation-delay: 4s; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .scan { animation: scan 6s linear infinite; }
    @keyframes type { to { width: 480px; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    @keyframes scan { from { transform: translateY(-40px); } to { transform: translateY(380px); } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <rect width="1200" height="340" fill="url(#glow)"/>
    <rect class="scan" x="0" y="0" width="1200" height="2" fill="#58a6ff" opacity="0.08"/>

    <!-- window chrome -->
    <circle cx="36" cy="32" r="6" fill="#ff5f57"/>
    <circle cx="56" cy="32" r="6" fill="#febc2e"/>
    <circle cx="76" cy="32" r="6" fill="#28c840"/>
    <text x="1164" y="37" text-anchor="end" class="mono" font-size="13" fill="#6e7681">~/vitroyfix — zsh</text>
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#21262d"/>

    <!-- identity -->
    <g class="fade d1">
      <text x="72" y="140" class="sans" font-size="64" font-weight="700" fill="#e6edf3">Peter Wangimwa</text>
    </g>
    <g class="fade d2">
      <rect x="74" y="160" width="300" height="4" rx="2" fill="url(#accent)"/>
      <text x="72" y="200" class="mono" font-size="20" fill="#8b949e">Full-Stack Engineer <tspan fill="#30363d">/</tspan> Cybersecurity Analyst <tspan fill="#30363d">/</tspan> IoT</text>
    </g>

    <!-- typed prompt -->
    <g transform="translate(72 236)">
      <text y="28" class="mono" font-size="18" fill="#3fb950">❯</text>
      <g transform="translate(26 0)">
        <g clip-path="url(#type)">
          <text y="28" class="mono" font-size="18" fill="#c9d1d9">build it end-to-end<tspan fill="#6e7681">&#160;&amp;&amp;&#160;</tspan>then try to break it</text>
        </g>
      </g>
      <rect class="cursor" x="500" y="12" width="10" height="20" fill="#58a6ff"/>
    </g>

    <!-- status chips -->
    <g class="fade d3 mono" font-size="13">
      <g transform="translate(72 290)">
        <rect width="168" height="28" rx="14" fill="#161b22" stroke="#30363d"/>
        <circle class="pulse" cx="18" cy="14" r="4" fill="#3fb950"/>
        <text x="32" y="18.5" fill="#c9d1d9">open to work</text>
      </g>
      <g transform="translate(252 290)">
        <rect width="178" height="28" rx="14" fill="#161b22" stroke="#30363d"/>
        <path d="M22 7a5 5 0 0 0-5 5c0 3.6 5 9 5 9s5-5.4 5-9a5 5 0 0 0-5-5zm0 6.8a1.8 1.8 0 1 1 0-3.6 1.8 1.8 0 0 1 0 3.6z" fill="#f85149"/>
        <text x="34" y="18.5" fill="#c9d1d9">Nairobi, Kenya</text>
      </g>
      <g transform="translate(442 290)">
        <rect width="128" height="28" rx="14" fill="#161b22" stroke="#30363d"/>
        <text x="16" y="18.5" fill="#58a6ff">@vitroyfix</text>
      </g>
    </g>

    <!-- shield emblem -->
    <g transform="translate(930 92)" fill="none" stroke-linejoin="round">
      <path d="M100 0 L190 34 V104 C190 160 150 196 100 214 C50 196 10 160 10 104 V34 Z" stroke="url(#accent)" stroke-width="3"/>
      <path d="M100 22 L170 48 V104 C170 148 140 176 100 192 C60 176 30 148 30 104 V48 Z" stroke="#30363d" stroke-width="1.5"/>
      <text x="100" y="118" text-anchor="middle" class="mono" font-size="34" font-weight="700" fill="#58a6ff" stroke="none">&lt;/&gt;</text>
      <circle class="pulse" cx="100" cy="150" r="4" fill="#3fb950" stroke="none"/>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="18" fill="none" stroke="#30363d"/>
</svg>
